# Runs the test suite and the meaning-preservation evaluation on the Node.js
# versions the project supports (see "engines" in package.json).
# The project has no dependencies and no build step, so there is nothing to
# install, cache or bundle.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm test
    - run: npm run eval
